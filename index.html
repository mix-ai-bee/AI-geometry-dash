<!-- =====================================================================
     ЯДРО ИГРЫ: физика всех режимов + ИИ. Без DOM — можно тестировать в Node.
     ===================================================================== -->
<script id="gameCore">
const GRID = 40;
const BASE_SPEED = 6.9;           // пикселей за кадр при скорости 1x (60 кадров/сек)
const CORRIDOR = 400;             // высота коридора для летающих режимов (10 блоков)
const SPEEDS = { SPEED_05: 0.8, SPEED_1: 1, SPEED_2: 1.25, SPEED_3: 1.5, SPEED_4: 1.85 };
const MODE_PORTALS = {
    CUBE_PORTAL: 'cube', SHIP_PORTAL: 'ship', BALL_PORTAL: 'ball', UFO_PORTAL: 'ufo',
    WAVE_PORTAL: 'wave', ROBOT_PORTAL: 'robot', SPIDER_PORTAL: 'spider', SWING_PORTAL: 'swing',
    AIRPLANE_PORTAL: 'airplane'
};
const CORRIDOR_MODES = { ship: 1, ball: 1, ufo: 1, wave: 1, spider: 1, swing: 1 };

const ORB_R = [-4, -4, 44, 44];
const PAD_R = [3, 0, 37, 7];
const PORTAL_R = [6, -40, 34, 80];
// Описание всех объектов: категория и хитбокс в координатах клетки (0..40, ось Y вверх)
const OBJ = {
    BLOCK: { cat: 'solid', rect: [0, 0, 40, 40] },
    SLAB: { cat: 'solid', rect: [0, 0, 40, 20] },
    SPIKE: { cat: 'hazard', rect: [14, 2, 26, 22] },
    SMALL_SPIKE: { cat: 'hazard', rect: [15, 0, 25, 11] },
    GROUND_SPIKES: { cat: 'hazard', rect: [6, 0, 34, 8] },
    SAW: { cat: 'hazard', circle: 22, rect: [-2, -2, 42, 42] },
    ORB: { cat: 'orb', kind: 'yellow', rect: ORB_R, fixed: 1 },
    PINK_ORB: { cat: 'orb', kind: 'pink', rect: ORB_R, fixed: 1 },
    RED_ORB: { cat: 'orb', kind: 'red', rect: ORB_R, fixed: 1 },
    GRAVITY_ORB: { cat: 'orb', kind: 'blue', rect: ORB_R, fixed: 1 },
    GREEN_ORB: { cat: 'orb', kind: 'green', rect: ORB_R, fixed: 1 },
    BLACK_ORB: { cat: 'orb', kind: 'black', rect: ORB_R, fixed: 1 },
    PAD: { cat: 'pad', kind: 'yellow', rect: PAD_R },
    PINK_PAD: { cat: 'pad', kind: 'pink', rect: PAD_R },
    RED_PAD: { cat: 'pad', kind: 'red', rect: PAD_R },
    BLUE_PAD: { cat: 'pad', kind: 'blue', rect: PAD_R },
    COIN: { cat: 'coin', rect: [6, 6, 34, 34], fixed: 1 },
    GOAL: { cat: 'goal', rect: [0, 0, 40, 40], fixed: 1 }
};
['CUBE_PORTAL','SHIP_PORTAL','BALL_PORTAL','UFO_PORTAL','WAVE_PORTAL','ROBOT_PORTAL','SPIDER_PORTAL','SWING_PORTAL','AIRPLANE_PORTAL',
 'GRAV_DOWN_PORTAL','GRAV_UP_PORTAL','MINI_PORTAL','BIG_PORTAL','SPEED_05','SPEED_1','SPEED_2','SPEED_3','SPEED_4']
    .forEach(t => OBJ[t] = { cat: 'portal', rect: PORTAL_R, fixed: 1 });

function rotPt(u, v, rot) {
    let r = (((rot || 0) % 360) + 360) % 360;
    for (let i = 0; i < Math.round(r / 90); i++) { const t = u; u = v; v = -t; }
    return [u, v];
}
function objRect(o) {
    const d = OBJ[o.type];
    const [a, b, c, e] = d.rect;
    const rot = d.fixed ? 0 : (o.rotation || 0);
    const p1 = rotPt(a - 20, b - 20, rot), p2 = rotPt(c - 20, e - 20, rot);
    return {
        x0: o.x + 20 + Math.min(p1[0], p2[0]), x1: o.x + 20 + Math.max(p1[0], p2[0]),
        y0: o.y + 20 + Math.min(p1[1], p2[1]), y1: o.y + 20 + Math.max(p1[1], p2[1])
    };
}

// Превращает JSON уровня в готовую к игре структуру
function normalizeLevel(data) {
    if (Array.isArray(data)) data = { objects: data };
    data = data || {};
    return {
        name: data.name || 'Мой уровень',
        color: data.color || '#2563eb',
        song: data.song || 0,
        objects: (data.objects || []).filter(o => o && OBJ[o.type]).map(o => ({
            type: o.type, x: Math.round(o.x / GRID) * GRID, y: Math.round(o.y / GRID) * GRID, rotation: o.rotation || 0
        }))
    };
}
function prepareLevel(data) {
    const lv = normalizeLevel(data);
    const objs = lv.objects.map((o, i) => {
        const d = OBJ[o.type];
        return { id: i, type: o.type, x: o.x, y: o.y, rotation: o.rotation, cat: d.cat, kind: d.kind, circle: d.circle, rect: objRect(o) };
    }).sort((a, b) => a.rect.x0 - b.rect.x0);
    const goal = objs.find(o => o.type === 'GOAL');
    const maxX = objs.reduce((m, o) => Math.max(m, o.rect.x1), 600);

            add('UFO_PORTAL', 200, 2); col(208, 0, 2); col(216, 7, 9); col(221, 3, 9); add('COIN', 219, 1);
            add('ROBOT_PORTAL', 224, 1); col(231, 0, 1); add('SPIKE', 235); add('SPIKE', 236);
            add('CUBE_PORTAL', 242, 1); add('SPIKE', 249); add('SPIKE', 250); add('SPIKE', 257);

        })
    }
];

<!-- ===================== ИНТЕРФЕЙС, РЕНДЕР, ЗВУК ===================== -->
<script>
    const store = {
        get(k, d) { try { const v = localStorage.getItem('gai13_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
        set(k, v) { try { localStorage.setItem('gai13_' + k, JSON.stringify(v)); } catch (e) {} }
    };
    let currentLang = store.get('lang', 'ru');
    const tr = (ru, en) => currentLang === 'ru' ? ru : en;
    const $ = id => document.getElementById(id);

    const MODE_NAMES = {
        cube: ['КУБ', 'CUBE'], ship: ['КОРАБЛЬ', 'SHIP'], ball: ['ШАР', 'BALL'], ufo: ['НЛО', 'UFO'], wave: ['ВОЛНА', 'WAVE'],
        robot: ['РОБОТ', 'ROBOT'], spider: ['ПАУК', 'SPIDER'], swing: ['КАЧЕЛИ', 'SWING'], airplane: ['САМОЛЁТИК', 'PLANE']
    };
    const DIFFS = [null,
        { ru: 'Легко', en: 'Easy', face: '🙂', color: '#38bdf8' },
        { ru: 'Нормально', en: 'Normal', face: '😐', color: '#4ade80' },
        { ru: 'Сложно', en: 'Hard', face: '😠', color: '#facc15' },
        { ru: 'Безумно', en: 'Insane', face: '😡', color: '#f472b6' },
        { ru: 'Экстрим', en: 'Extreme', face: '👿', color: '#ef4444' }];
    const ICON_COLORS = ['#ffffff', '#ffe600', '#3dff6e', '#33ccff', '#ff5fd2', '#ff8c1a', '#b266ff'];
    let iconColor = store.get('iconColor', '#ffe600');

    // ---------- Музыка ----------
    const SONGS = [
        { name: 'Classic', bpm: 160, notes: [261.63, 329.63, 392.0, 523.25, 392.0, 329.63, 440.0, 523.25] },
        { name: 'Night Drive', bpm: 150, notes: [220, 0, 261.63, 220, 329.63, 0, 293.66, 261.63, 196, 0, 246.94, 196, 293.66, 0, 261.63, 246.94] },
        { name: 'Green Wave', bpm: 175, notes: [329.63, 392, 493.88, 392, 587.33, 493.88, 392, 329.63, 369.99, 440, 554.37, 440, 659.25, 554.37, 440, 369.99] },
        { name: 'Machinery', bpm: 180, notes: [146.83, 146.83, 293.66, 146.83, 174.61, 174.61, 349.23, 174.61, 130.81, 130.81, 261.63, 130.81, 196, 196, 392, 233.08] },
        { name: 'Final Rush', bpm: 200, notes: [440, 523.25, 659.25, 880, 783.99, 659.25, 523.25, 587.33, 698.46, 880, 1046.5, 880, 698.46, 587.33, 523.25, 493.88] }
    ];
    class MusicEngine {
        constructor() { this.ctx = null; this.enabled = store.get('music', true); this.timer = null; this.step = 0; this.song = 0; }
        ensure() {
            if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; } }
            if (this.ctx.state === 'suspended') this.ctx.resume();
            return true;
        }
        play(song) {
            if (song !== undefined && song !== this.song) { this.song = song; this.stop(); }
            if (!this.enabled || this.timer || !this.ensure()) return;
            const sng = SONGS[this.song] || SONGS[0];
            this.step = 0;
            this.timer = setInterval(() => {
                if (!this.enabled || !this.ctx) return;
                const f = sng.notes[this.step % sng.notes.length]; this.step++;
                if (!f) return;
                try {
                    const t = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                    osc.type = 'square'; osc.frequency.setValueAtTime(f, t);
                    gain.gain.setValueAtTime(0.03, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
                    osc.connect(gain); gain.connect(this.ctx.destination); osc.start(t); osc.stop(t + 0.18);
                    if (this.step % 4 === 1) {
                        const k = this.ctx.createOscillator(), kg = this.ctx.createGain();
                        k.type = 'sine'; k.frequency.setValueAtTime(120, t); k.frequency.exponentialRampToValueAtTime(40, t + 0.12);
                        kg.gain.setValueAtTime(0.12, t); kg.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
                        k.connect(kg); kg.connect(this.ctx.destination); k.start(t); k.stop(t + 0.15);
                    }
                } catch (e) {}
            }, 60000 / sng.bpm / 2);
        }
        restart(song) { this.stop(); this.song = song; this.play(); }
        stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } }
        toggle() { this.enabled = !this.enabled; store.set('music', this.enabled); if (this.enabled) this.play(); else this.stop(); }
    }
    const music = new MusicEngine();

    class SoundFX {
        constructor() { this.enabled = store.get('sound', true); }
        tone(freq, duration, type = 'sine', gainVal = 0.1, slide) {
            if (!this.enabled || !music.ensure()) return;
            const c = music.ctx;
            try {
                const t = c.currentTime, osc = c.createOscillator(), gain = c.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, t);
                if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + duration);
                gain.gain.setValueAtTime(gainVal, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
                osc.connect(gain); gain.connect(c.destination); osc.start(t); osc.stop(t + duration);
            } catch (e) {}
        }
        jump() { this.tone(400, 0.1, 'square', 0.05, 600); }
        pad() { this.tone(500, 0.2, 'triangle', 0.1, 1000); }
        orb() { this.tone(900, 0.22, 'sine', 0.1, 1300); }
        portal() { this.tone(300, 0.3, 'sawtooth', 0.05, 900); }
        coin() { this.tone(1200, 0.08, 'square', 0.06); setTimeout(() => this.tone(1600, 0.15, 'square', 0.06), 70); }
        explode() { this.tone(160, 0.4, 'sawtooth', 0.15, 40); }
        win() { [440, 554.37, 659.25, 880, 1108.7].forEach((f, i) => setTimeout(() => this.tone(f, 0.3, 'sine', 0.1), i * 110)); }
    }
    const sound = new SoundFX();

    function refreshAudioButtons() {
        $('btnSoundToggle').innerHTML = (sound.enabled ? '🔊 ' : '🔇 ') + tr('Звук', 'Sound');
        $('btnMusicToggle').innerHTML = (music.enabled ? '🎵 ' : '🔇 ') + tr('Музыка', 'Music');
    }
    $('btnSoundToggle').addEventListener('click', () => { sound.enabled = !sound.enabled; store.set('sound', sound.enabled); refreshAudioButtons(); });
    $('btnMusicToggle').addEventListener('click', () => { music.toggle(); refreshAudioButtons(); });

    // ---------- Язык ----------
    function applyLang() {
        document.querySelectorAll('[data-ru]').forEach(el => { const t = el.getAttribute('data-' + currentLang); if (t) el.innerText = t; });
        $('edLevelName').placeholder = tr('Название уровня', 'Level name');
        refreshAudioButtons(); renderTabs(); renderToolBar(); renderLevelCards(); updatePracticeBtn();
        if (G.L) updateHud(true);
    }
    $('btnLangToggle').addEventListener('click', () => { currentLang = currentLang === 'ru' ? 'en' : 'ru'; store.set('lang', currentLang); applyLang(); });

    // ---------- Состояние приложения ----------
    const G = {
        screen: 'MENU', mode: 'EDITOR', source: null, L: null, S: null, held: false,
        running: false, paused: false, deathTimer: 0, attempts: 1, practice: false, checkpoints: [],
        particles: [], waveTrail: [], trail: [], aiPlan: [], aiTimer: 0, aiAction: false, lastAiMode: null,
        camX: 0, camY: -80, edCamX: -120, edCamY: -80, frameT: 0, bestThisRun: 0, fromEditor: false
    };
    let editorLevel = normalizeLevel(store.get('editorLevel', { name: '', color: '#2563eb', song: 0, objects: [] }));
    function saveEditor() { store.set('editorLevel', editorLevel); }

    function showScreen(name) {
        G.screen = name;
        $('screenMenu').classList.toggle('hidden', name !== 'MENU');
        $('screenLevels').classList.toggle('hidden', name !== 'LEVELS');
        $('screenGame').classList.toggle('hidden', name !== 'GAME');
        $('btnMenu').classList.toggle('hidden', name === 'MENU');
        if (name !== 'GAME') { G.running = false; music.restart(0); }
        if (name === 'LEVELS') renderLevelCards();
        if (name === 'GAME') setTimeout(resizeCanvas, 0);
    }
    $('btnMenu').addEventListener('click', () => showScreen('MENU'));
    $('logoHomeBtn').addEventListener('click', () => showScreen('MENU'));
    $('btnOfficial').addEventListener('click', () => { music.play(); showScreen('LEVELS'); });
    $('btnCreate').addEventListener('click', () => { music.play(); openEditor(); });
    $('btnLevelsBack').addEventListener('click', () => showScreen('MENU'));

    // Фон меню
    (function () {
        const bg = $('menuBgSquares');
        for (let i = 0; i < 18; i++) {
            const d = document.createElement('div');
            const s = 20 + Math.random() * 50;
            d.className = 'float-sq';
            d.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;animation-duration:${8 + Math.random() * 12}s;animation-delay:${-Math.random() * 15}s`;
            bg.appendChild(d);
        }
        const cp = $('colorPicker');
        ICON_COLORS.forEach(c => {
            const d = document.createElement('div');
            d.className = 'color-dot' + (c === iconColor ? ' sel' : '');
            d.style.background = c;
            d.addEventListener('click', () => { iconColor = c; store.set('iconColor', c); cp.querySelectorAll('.color-dot').forEach(x => x.classList.remove('sel')); d.classList.add('sel'); });
            cp.appendChild(d);
        });
    })();

    // ---------- Карточки уровней ----------
    function renderLevelCards() {
        const box = $('levelCards'); if (!box) return;
        box.innerHTML = '';
        OFFICIAL_LEVELS.forEach((lv, i) => {
            const d = DIFFS[lv.difficulty] || DIFFS[1];
            const prog = store.get('prog_' + i, { best: 0, practice: 0, coins: [] });
            const coinTotal = lv.objects.filter(o => o.type === 'COIN').length;
            const card = document.createElement('div');
            card.className = 'level-card rounded-3xl p-4 flex flex-col gap-3 border-2 shadow-2xl';
            card.style.background = `linear-gradient(160deg, ${lv.color}cc, #09090b 75%)`;
            card.style.borderColor = lv.color;
            let coinsHtml = '';
            for (let c = 0; c < coinTotal; c++) coinsHtml += `<span class="${c < prog.coins.length ? 'text-yellow-300' : 'text-zinc-600'}">●</span>`;
            card.innerHTML = `
                <div class="flex justify-between items-center"><span class="font-mono text-xs text-white/70">#${i + 1}</span><span class="text-3xl">${d.face}</span></div>
                <div class="text-xl font-black italic leading-tight">${currentLang === 'ru' ? lv.name : (lv.nameEn || lv.name)}</div>
                <div class="text-xs font-black uppercase" style="color:${d.color}">${tr(d.ru, d.en)} ${'★'.repeat(lv.difficulty)}</div>
                <div class="text-[11px] font-mono text-zinc-300">${tr('Обычный', 'Normal')}: ${prog.best}%</div>
                <div class="w-full h-2 bg-black/60 rounded-full overflow-hidden"><div class="h-full bg-white" style="width:${prog.best}%"></div></div>
                <div class="text-[11px] font-mono text-zinc-400">${tr('Тренировка', 'Practice')}: ${prog.practice}%</div>
                <div class="w-full h-1.5 bg-black/60 rounded-full overflow-hidden"><div class="h-full bg-emerald-400" style="width:${prog.practice}%"></div></div>
                <div class="text-sm tracking-widest">${coinsHtml}</div>
                <div class="flex gap-2 mt-auto">
                    <button data-play="${i}" class="flex-1 py-2 rounded-xl bg-white text-black font-black text-sm">▶ ${tr('Играть', 'Play')}</button>
                    <button data-ai="${i}" title="AI" class="px-3 py-2 rounded-xl bg-black/50 border border-white/30 font-black text-sm">🤖</button>
                </div>`;
            box.appendChild(card);
        });
        box.querySelectorAll('[data-play]').forEach(b => b.addEventListener('click', () => startLevel({ kind: 'official', index: +b.dataset.play }, 'PLAY')));
        box.querySelectorAll('[data-ai]').forEach(b => b.addEventListener('click', () => startLevel({ kind: 'official', index: +b.dataset.ai }, 'AI')));
    }

    // ---------- Холст ----------
    const canvas = $('gameCanvas');
    const ctx = canvas.getContext('2d');
    const VIEW_H = 520;
    let SCALE = 1, VIEW_W = 1200;
    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        SCALE = canvas.height / VIEW_H;
        VIEW_W = canvas.width / SCALE;
    }
    window.addEventListener('resize', resizeCanvas);

    function camera() {
        if (G.mode === 'EDITOR') return { x: G.edCamX, y: G.edCamY };
        return { x: G.camX, y: G.camY };
    }
    // мир -> экран: поставить начало координат в точку мира (wx, wy), y вниз
    function at(cam, wx, wy) {
        ctx.setTransform(SCALE, 0, 0, SCALE, (wx - cam.x) * SCALE, canvas.height - (wy - cam.y) * SCALE);
    }

    // ---------- Запуск уровня ----------
    function levelData(src) {
        if (src.kind === 'official') return OFFICIAL_LEVELS[src.index];
        return editorLevel;
    }
    function startLevel(src, mode) {
        G.source = src; G.mode = mode;
        G.fromEditor = src.kind === 'editor';
        G.L = prepareLevel(levelData(src));
        G.attempts = 1; G.practice = false; G.checkpoints = []; G.bestThisRun = 0;
        showScreen('GAME');
        $('bottomEditorBar').classList.add('hidden');
        $('editorScrollControls').classList.add('hidden');
        $('playControlsOverlay').classList.remove('hidden');
        $('aiLogContainer').classList.toggle('hidden', mode !== 'AI');
        $('aiThoughtLog').innerHTML = '';
        if (mode === 'AI') aiLog(tr('Загружаю уровень и начинаю просчитывать будущее...', 'Loading level, simulating the future...'));
        music.restart(G.L.song);
        resetRun(true);
    }
    function resetRun(full) {
        const cp = G.practice && !full ? G.checkpoints[G.checkpoints.length - 1] : null;
        G.S = cp ? Object.assign({}, cp) : initState(G.L);
        G.running = true; G.paused = false; G.deathTimer = 0;
        G.held = G.mode === 'PLAY' ? G.held : false;
        if (G.S.prevHeld !== undefined) G.S.prevHeld = true; // не прыгать сразу после рестарта от старого нажатия
        G.aiPlan = []; G.aiTimer = 0; G.trail = []; G.waveTrail = [];
        G.camX = G.S.x - VIEW_W * 0.3;
        G.camY = cameraTargetY(G.S, -80);
        $('winModal').classList.add('hidden');
        $('pauseModal').classList.add('hidden');
        if (!cp && !G.practice) music.restart(G.L.song);
        updateHud(true);
    }
    function onDeath() {
        sound.explode();
        burst(G.S.x + pSize(G.S) / 2, G.S.y + pSize(G.S) / 2, iconColor, 30, 7);
        burst(G.S.x + pSize(G.S) / 2, G.S.y + pSize(G.S) / 2, '#ffffff', 16, 5);
        saveProgress(false);
        G.deathTimer = 40;
        if (G.mode === 'AI') aiLog(tr('💥 Не смог найти безопасный путь. Пробую снова!', '💥 No safe path found. Retrying!'));
    }
    function onWin() {
        G.running = false;
        sound.win();
        saveProgress(true);
        const coins = G.S.coins.length;
        $('winSubText').innerText = tr(`Попыток: ${G.attempts} • Монет: ${coins}/${G.L.coinTotal}`, `Attempts: ${G.attempts} • Coins: ${coins}/${G.L.coinTotal}`)
            + (G.practice ? tr(' • (тренировка)', ' • (practice)') : '');
        $('winModal').classList.remove('hidden');
        if (G.mode === 'AI') aiLog(tr('🏁 Уровень пройден! Траектория была идеальной.', '🏁 Level complete! Perfect trajectory.'));
        for (let i = 0; i < 5; i++) setTimeout(() => burst(G.S.x, G.S.y + 100, ['#fff', '#ffe600', '#3dff6e', '#33ccff', '#ff5fd2'][i], 30, 8), i * 150);
    }
    function progressPct() {
        if (!G.L || !G.S) return 0;
        if (G.S.won) return 100;
        return Math.max(0, Math.min(100, Math.floor(G.S.x / G.L.goalX * 100)));
    }
    function saveProgress(won) {
        if (!G.source || G.source.kind !== 'official' || G.mode !== 'PLAY') return;
        const key = 'prog_' + G.source.index;
        const prog = store.get(key, { best: 0, practice: 0, coins: [] });
        const pct = won ? 100 : progressPct();
        if (G.practice) prog.practice = Math.max(prog.practice, pct);
        else {
            prog.best = Math.max(prog.best, pct);
            if (won) {
                const lvObjs = G.L.objs;
                G.S.coins.forEach(id => { const o = lvObjs.find(x => x.id === id); const k = o ? o.x + ':' + o.y : id; if (!prog.coins.includes(k)) prog.coins.push(k); });
            }
        }
        store.set(key, prog);
    }

    // ---------- Тренировка ----------
    function updatePracticeBtn() {
        $('practiceBtnText').innerText = G.practice ? tr('Выйти из тренировки', 'Exit practice') : tr('Тренировка', 'Practice');
        $('hudPractice').classList.toggle('hidden', !G.practice);
    }
    $('btnPracticeToggle').addEventListener('click', () => {
        G.practice = !G.practice; G.checkpoints = [];
        updatePracticeBtn();
        G.attempts++;
        resetRun(true);
    });

    // ---------- Пауза ----------
    function setPaused(p) {
        if (G.screen !== 'GAME' || G.mode === 'EDITOR' || !G.running) return;
        G.paused = p;
        $('pauseModal').classList.toggle('hidden', !p);
        if (p) music.stop(); else music.play();
    }
    $('btnPause').addEventListener('click', () => setPaused(!G.paused));
    $('btnResume').addEventListener('click', () => setPaused(false));
    $('btnRestart').addEventListener('click', () => { G.attempts++; G.checkpoints = []; resetRun(true); });
    $('btnPauseExit').addEventListener('click', exitLevel);
    $('btnWinRestart').addEventListener('click', () => { G.attempts = 1; G.checkpoints = []; resetRun(true); });
    $('btnWinExit').addEventListener('click', exitLevel);
    function exitLevel() {
        $('pauseModal').classList.add('hidden'); $('winModal').classList.add('hidden');
        if (G.fromEditor) openEditor(); else showScreen('LEVELS');
    }

    // ---------- ИИ ----------
    function aiLog(msg) {
        const box = $('aiThoughtLog');
        const d = document.createElement('div');
        d.textContent = `[ИИ 3.0]: ${msg}`;
        box.appendChild(d);
        while (box.children.length > 30) box.removeChild(box.firstChild);
        box.scrollTop = box.scrollHeight;
    }
    function aiTick() {
        if (G.aiTimer <= 0) {
            const prev = G.aiPlan.slice(1);
            const res = aiSearch(G.S, G.L, prev, 5000);
            const changed = prev.length && res.plan.some((a, i) => prev[i] !== undefined && prev[i] !== a);
            G.aiPlan = res.plan;
            G.aiTimer = AI_CHUNK;
            $('aiStatusBadge').innerText = res.safe ? tr('✅ Путь безопасен', '✅ Path is safe') : tr('⚠️ Опасно!', '⚠️ Danger!');
            if (changed && Math.random() < 0.15) aiLog(tr('Вижу препятствие впереди — меняю траекторию.', 'Obstacle ahead — adjusting trajectory.'));
        }
        G.aiTimer--;
        return !!G.aiPlan[0];
    }

    // ---------- Игровой цикл ----------
    function cameraTargetY(S, cur) {
        if (S.ceil != null) return S.floor - (VIEW_H - CORRIDOR) / 2 + 20;
        let t = cur;
        const rel = S.y - cur;
        if (rel > VIEW_H * 0.58) t = S.y - VIEW_H * 0.58;
        if (rel < VIEW_H * 0.22) t = S.y - VIEW_H * 0.22;
        return Math.max(-80, t);
    }
    function gameStep() {
        if (G.deathTimer > 0) {
            G.deathTimer--;
            if (G.deathTimer === 0) { G.attempts++; resetRun(false); }
            return;
        }
        const input = G.mode === 'AI' ? aiTick() : G.held;
        const prev = G.S;
        G.S = step(G.S, input, G.L);
        const S = G.S;
        handleFx(S, prev);
        if (S.mode === 'wave') { G.waveTrail.push([S.x + pSize(S) / 2, S.y + pSize(S) / 2]); if (G.waveTrail.length > 90) G.waveTrail.shift(); }
        else G.waveTrail = [];
        if (S.frame % 2 === 0) G.trail.push({ x: S.x + pSize(S) / 2, y: S.y + pSize(S) / 2, a: 0.5, s: pSize(S) * 0.6 });
        if (S.mode !== prev.mode && G.mode === 'AI') aiLog(tr(`Новый режим: ${MODE_NAMES[S.mode][0]}. Перестраиваю модель физики.`, `New mode: ${MODE_NAMES[S.mode][1]}. Rebuilding physics model.`));
        if (S.dead) { onDeath(); return; }
        if (S.won) { onWin(); return; }
        if (G.practice && S.frame % 75 === 0 && (S.grounded || S.mode !== 'cube')) {
            G.checkpoints.push(Object.assign({}, S));
            if (G.checkpoints.length > 50) G.checkpoints.shift();
        }
        G.camX = S.x - VIEW_W * 0.3;
        G.camY += (cameraTargetY(S, G.camY) - G.camY) * 0.12;
    }
    function handleFx(S, prev) {
        if (!S.fx) return;
        const f = S.fx;
        const cx = S.x + pSize(S) / 2, cy = S.y + pSize(S) / 2;
        if (f.t === 'jump') { sound.jump(); burst(cx, S.g === 1 ? S.y : S.y + pSize(S), '#ffffff', 5, 2); }
        else if (f.t === 'flip') { sound.jump(); burst(cx, cy, iconColor, 8, 3); }
        else if (f.t === 'orb') { sound.orb(); burst(f.x, f.y, ORB_COLORS[f.kind], 16, 4); ring(f.x, f.y, ORB_COLORS[f.kind]); }
        else if (f.t === 'pad') { sound.pad(); burst(f.x, f.y, ORB_COLORS[f.kind], 14, 4); }
        else if (f.t === 'portal') { sound.portal(); burst(f.x, f.y, portalColor(f.type), 20, 5); ring(f.x, f.y, portalColor(f.type)); }
        else if (f.t === 'coin') { sound.coin(); burst(f.x, f.y, '#ffd700', 20, 4); }
        else if (f.t === 'spider') { sound.jump(); for (let i = 0; i < 10; i++) G.particles.push({ x: cx, y: f.from + (S.y - f.from) * i / 10 + pSize(S) / 2, vx: 0, vy: 0, a: 0.8, c: iconColor, s: 8 }); }
    }
    function burst(x, y, c, n, sp) {
        for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2, v = Math.random() * sp + 1;
            G.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, a: 1, c, s: 3 + Math.random() * 4 });
        }
    }
    function ring(x, y, c) { G.particles.push({ x, y, ring: 1, r: 10, a: 0.9, c }); }

    let lastT = performance.now(), acc = 0;
    function loop(now) {
        const dt = Math.min(0.1, (now - lastT) / 1000);
        lastT = now;
        G.frameT += dt;
        if (G.screen === 'GAME') {
            if (G.mode !== 'EDITOR' && G.running && !G.paused) {
                acc += dt;
                let n = 0;
                while (acc >= 1 / 60 && n < 5) { gameStep(); acc -= 1 / 60; n++; if (!G.running) break; }
                if (n >= 5) acc = 0;
            } else acc = 0;
            if (!G.paused) {
                G.particles.forEach(p => { if (p.ring) { p.r += 3; p.a -= 0.05; } else { p.x += p.vx; p.y += p.vy; p.vy -= 0.08; p.a -= 0.025; } });
                G.particles = G.particles.filter(p => p.a > 0);
                G.trail.forEach(t => t.a -= 0.04); G.trail = G.trail.filter(t => t.a > 0);
            }
            render();
            updateHud(false);
        }
        requestAnimationFrame(loop);
    }

    let hudCache = '';
    function updateHud(force) {
        if (!G.L) return;
        const S = G.S;
        const pct = G.mode === 'EDITOR' ? 0 : progressPct();
        const name = G.mode === 'EDITOR' ? tr('🛠 Редактор', '🛠 Editor') + (editorLevel.name ? ': ' + editorLevel.name : '') : (G.source.kind === 'official' ? (currentLang === 'ru' ? OFFICIAL_LEVELS[G.source.index].name : OFFICIAL_LEVELS[G.source.index].nameEn) : (editorLevel.name || tr('Мой уровень', 'My level')));
        const mode = S ? MODE_NAMES[S.mode][currentLang === 'ru' ? 0 : 1] + (S.mini ? tr(' (мини)', ' (mini)') : '') + (S.speed !== 1 ? ' ×' + S.speed : '') : '—';
        const coins = S && G.L.coinTotal ? `★ ${S.coins.length}/${G.L.coinTotal}` : '';
        const key = [pct, name, mode, coins, G.attempts, G.mode].join('|');
        if (!force && key === hudCache) return;
        hudCache = key;
        $('hudPercentText').innerText = pct + '%';
        $('hudProgressBar').style.width = pct + '%';
        $('hudLevelName').innerText = name;
        $('hudModeText').innerText = G.mode === 'EDITOR' ? tr('РЕДАКТОР', 'EDITOR') : mode;
        $('hudAttemptText').innerText = '#' + G.attempts;
        $('hudCoins').innerText = G.mode === 'EDITOR' ? '' : coins;
    }

    // ---------- Рендер ----------
    const ORB_COLORS = { yellow: '#ffe600', pink: '#ff5fd2', red: '#ff3b3b', blue: '#33ccff', green: '#3dff6e', black: '#222222' };
    const PORTAL_STYLE = {
        CUBE_PORTAL: ['#3dff6e', '■'], SHIP_PORTAL: ['#ff5fd2', '➤'], BALL_PORTAL: ['#ff3b3b', '●'], UFO_PORTAL: ['#ff9f1a', '◓'],
        WAVE_PORTAL: ['#33ccff', '◢'], ROBOT_PORTAL: ['#f4f4f5', '🤖'], SPIDER_PORTAL: ['#b266ff', '🕷'], SWING_PORTAL: ['#ffe600', '⇅'],
        AIRPLANE_PORTAL: ['#ff8c00', '✈'], GRAV_DOWN_PORTAL: ['#33a1ff', '↓'], GRAV_UP_PORTAL: ['#ffd500', '↑'],
        MINI_PORTAL: ['#ff66cc', '◦'], BIG_PORTAL: ['#33ff99', '◯'],
        SPEED_05: ['#ff9f1a', '<'], SPEED_1: ['#33ccff', '>'], SPEED_2: ['#3dff6e', '>>'], SPEED_3: ['#ff5fd2', '>>>'], SPEED_4: ['#ff3b3b', '>>>>']
    };
    function portalColor(t) { return (PORTAL_STYLE[t] || ['#fff'])[0]; }
    function shade(hex, f) {
        const n = parseInt(hex.slice(1), 16);
        let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
        if (f < 0) { r *= 1 + f; g *= 1 + f; b *= 1 + f; } else { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
        return `rgb(${r | 0},${g | 0},${b | 0})`;
    }

    function drawObject(o, t, cam) {
        at(cam, o.x + 20, o.y + 20);
        const fixed = OBJ[o.type].fixed;
        if (!fixed) ctx.rotate((o.rotation || 0) * Math.PI / 180);
        const used = G.S && G.mode !== 'EDITOR' && G.S.used.includes(o.id);
        const lc = G.L ? G.L.color : '#2563eb';
        switch (o.type) {
            case 'BLOCK': {
                const gr = ctx.createLinearGradient(0, -20, 0, 20);
                gr.addColorStop(0, shade(lc, -0.55)); gr.addColorStop(1, '#050507');
                ctx.fillStyle = gr; ctx.fillRect(-20, -20, 40, 40);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(-19, -19, 38, 38);
                ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.strokeRect(-12, -12, 24, 24);
                break;
            }
            case 'SLAB': {
                ctx.fillStyle = shade(lc, -0.6); ctx.fillRect(-20, 0, 40, 20);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(-19, 1, 38, 18);
                break;
            }
            case 'SPIKE': case 'SMALL_SPIKE': {
                const h = o.type === 'SPIKE' ? 40 : 18;
                ctx.beginPath(); ctx.moveTo(-18, 20); ctx.lineTo(0, 20 - h); ctx.lineTo(18, 20); ctx.closePath();
                const gr = ctx.createLinearGradient(0, 20 - h, 0, 20); gr.addColorStop(0, '#2a2a2a'); gr.addColorStop(1, '#000');
                ctx.fillStyle = gr; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                break;
            }
            case 'GROUND_SPIKES': {
                ctx.beginPath(); ctx.moveTo(-18, 20);
                for (let i = 0; i < 4; i++) { ctx.lineTo(-18 + i * 9 + 4.5, 9); ctx.lineTo(-18 + (i + 1) * 9, 20); }
                ctx.closePath(); ctx.fillStyle = '#000'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
                break;
            }
            case 'SAW': {
                ctx.rotate(t * 6);
                ctx.beginPath();
                for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2, r = i % 2 ? 22 : 30; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
                ctx.closePath(); ctx.fillStyle = '#111'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.strokeStyle = '#fff'; ctx.stroke();
                break;
            }
            case 'ORB': case 'PINK_ORB': case 'RED_ORB': case 'GRAVITY_ORB': case 'GREEN_ORB': case 'BLACK_ORB': {
                const c = ORB_COLORS[OBJ[o.type].kind];
                const pulse = 1 + Math.sin(t * 6) * 0.08;
                ctx.beginPath(); ctx.arc(0, 0, 19 * pulse, 0, Math.PI * 2); ctx.strokeStyle = used ? 'rgba(255,255,255,.15)' : c; ctx.lineWidth = 2; ctx.stroke();
                ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fillStyle = used ? '#3f3f46' : c; ctx.fill();
                ctx.strokeStyle = o.type === 'BLACK_ORB' ? '#fff' : '#000'; ctx.lineWidth = 2.5; ctx.stroke();
                if (o.type === 'GRAVITY_ORB' || o.type === 'GREEN_ORB') { ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke(); }
                break;
            }
            case 'PAD': case 'PINK_PAD': case 'RED_PAD': case 'BLUE_PAD': {
                const c = ORB_COLORS[OBJ[o.type].kind];
                ctx.beginPath(); ctx.moveTo(-17, 20); ctx.quadraticCurveTo(0, 6, 17, 20); ctx.closePath();
                ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
                if (!used) { ctx.globalAlpha = 0.4 + Math.sin(t * 8) * 0.2; ctx.fillStyle = c; ctx.fillRect(-12, 2 - (t * 30 % 14), 24, 2); ctx.globalAlpha = 1; }
                break;
            }
            case 'COIN': {
                if (used) break;
                const sx = Math.cos(t * 3);
                ctx.scale(Math.max(0.15, Math.abs(sx)), 1);
                ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fillStyle = '#ffd700'; ctx.fill();
                ctx.strokeStyle = '#7a5a00'; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = '#7a5a00'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('★', 0, 1);
                break;
            }
            case 'GOAL': {
                if (G.mode === 'EDITOR') {
                    ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(-20, -20, 40, 40);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(-20, -20, 40, 40);
                    ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🏁', 0, 2);
                }
                break;
            }
            default: {
                const st = PORTAL_STYLE[o.type];
                if (!st) break;
                const [c, label] = st;
                const isSpeed = o.type.startsWith('SPEED');
                if (isSpeed) {
                    ctx.fillStyle = c; ctx.globalAlpha = used ? 0.35 : 1;
                    ctx.font = 'bold 26px JetBrains Mono, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.shadowColor = c; ctx.shadowBlur = 14; ctx.fillText(label, 0, 2); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
                    break;
                }
                ctx.globalAlpha = used ? 0.4 : 1;
                ctx.shadowColor = c; ctx.shadowBlur = 18;
                ctx.beginPath(); ctx.ellipse(0, 0, 13, 58, 0, 0, Math.PI * 2);
                ctx.strokeStyle = c; ctx.lineWidth = 6; ctx.stroke();
                ctx.beginPath(); ctx.ellipse(0, 0, 7, 50, 0, 0, Math.PI * 2); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = c; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, 0, 1);
                ctx.globalAlpha = 1;
            }
        }
    }

    function drawPlayer(S, cam) {
        const size = pSize(S);
        at(cam, S.x + size / 2, S.y + size / 2);
        const flip = S.g === -1;
        ctx.rotate(S.rot * Math.PI / 180);
        if (flip && S.mode !== 'cube' && S.mode !== 'ball') ctx.scale(1, -1);
        const k = size / 34;
        ctx.scale(k, k);
        const c1 = iconColor, c2 = '#000', c3 = shade(iconColor, -0.45);
        const cubeIcon = (s) => {
            ctx.fillStyle = c1; ctx.fillRect(-s, -s, s * 2, s * 2);
            ctx.strokeStyle = c2; ctx.lineWidth = 2.5; ctx.strokeRect(-s, -s, s * 2, s * 2);
            ctx.fillStyle = c3; ctx.fillRect(-s * 0.55, -s * 0.55, s * 1.1, s * 1.1);
            ctx.strokeRect(-s * 0.55, -s * 0.55, s * 1.1, s * 1.1);
            ctx.fillStyle = '#000'; ctx.fillRect(-s * 0.35, -s * 0.3, s * 0.22, s * 0.22); ctx.fillRect(s * 0.13, -s * 0.3, s * 0.22, s * 0.22);
        };
        ctx.lineJoin = 'round';
        switch (S.mode) {
            case 'cube': cubeIcon(17); break;
            case 'ship':
                ctx.save(); ctx.translate(-2, -8); cubeIcon(8); ctx.restore();
                ctx.beginPath(); ctx.moveTo(-20, -2); ctx.lineTo(20, 2); ctx.lineTo(8, 12); ctx.lineTo(-20, 12); ctx.closePath();
                ctx.fillStyle = c3; ctx.fill(); ctx.strokeStyle = c2; ctx.lineWidth = 2.5; ctx.stroke();
                ctx.fillStyle = c1; ctx.fillRect(-14, 4, 18, 4);
                break;
            case 'ball':
                ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fillStyle = c1; ctx.fill(); ctx.strokeStyle = c2; ctx.lineWidth = 2.5; ctx.stroke();
                for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -17); ctx.stroke(); }
                ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fillStyle = c3; ctx.fill(); ctx.stroke();
                break;
            case 'ufo':
                ctx.save(); ctx.translate(0, -6); ctx.beginPath(); ctx.arc(0, 0, 10, Math.PI, 0); ctx.fillStyle = 'rgba(200,240,255,.8)'; ctx.fill(); ctx.strokeStyle = c2; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
                ctx.save(); ctx.translate(0, -8); cubeIcon(5); ctx.restore();
                ctx.beginPath(); ctx.ellipse(0, 4, 19, 8, 0, 0, Math.PI * 2); ctx.fillStyle = c1; ctx.fill(); ctx.strokeStyle = c2; ctx.lineWidth = 2.5; ctx.stroke();
                ctx.fillStyle = c3; ctx.fillRect(-12, 3, 24, 3);
                break;
            case 'wave':
                ctx.beginPath(); ctx.moveTo(-14, -12); ctx.lineTo(18, 0); ctx.lineTo(-14, 12); ctx.lineTo(-6, 0); ctx.closePath();
                ctx.fillStyle = c1; ctx.fill(); ctx.strokeStyle = c2; ctx.lineWidth = 2.5; ctx.stroke();
                break;
            case 'robot': {
                const leg = Math.sin(G.frameT * 20) * (S.grounded ? 5 : 0);
                ctx.fillStyle = c3; ctx.strokeStyle = c2; ctx.lineWidth = 2;
                ctx.fillRect(-11 + leg, 6, 7, 11); ctx.strokeRect(-11 + leg, 6, 7, 11);
                ctx.fillRect(4 - leg, 6, 7, 11); ctx.strokeRect(4 - leg, 6, 7, 11);
                ctx.save(); ctx.translate(0, -4); cubeIcon(12); ctx.restore();
                break;
            }
            case 'spider': {
                ctx.strokeStyle = c2; ctx.lineWidth = 5;
                for (let i = -1; i <= 1; i += 2) for (let j = 0; j < 2; j++) {
                    const sw = Math.sin(G.frameT * 25 + j * 2) * 3;
                    ctx.beginPath(); ctx.moveTo(i * 4, 4); ctx.lineTo(i * (12 + j * 5), 2 + sw); ctx.lineTo(i * (14 + j * 5), 17); ctx.stroke();
                    ctx.strokeStyle = c1; ctx.lineWidth = 2.5; ctx.stroke(); ctx.strokeStyle = c2; ctx.lineWidth = 5;
                }
                ctx.beginPath(); ctx.ellipse(0, -2, 14, 10, 0, 0, Math.PI * 2); ctx.fillStyle = c1; ctx.fill(); ctx.strokeStyle = c2; ctx.lineWidth = 2.5; ctx.stroke();
                ctx.fillStyle = '#000'; ctx.fillRect(-6, -5, 4, 4); ctx.fillRect(2, -5, 4, 4);
                break;
            }
            case 'swing':
                ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fillStyle = c1; ctx.fill(); ctx.strokeStyle = c2; ctx.lineWidth = 2.5; ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(-22, -16); ctx.lineTo(-14, -2); ctx.closePath(); ctx.fillStyle = c3; ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(-22, 16); ctx.lineTo(-14, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(2, 0, 6, 0, Math.PI * 2); ctx.fillStyle = c3; ctx.fill(); ctx.stroke();
                break;
            case 'airplane':
                ctx.beginPath(); ctx.moveTo(-15, 10); ctx.lineTo(20, 0); ctx.lineTo(-15, -10); ctx.closePath();
                ctx.fillStyle = c1; ctx.fill(); ctx.strokeStyle = c2; ctx.lineWidth = 2; ctx.stroke();
                break;
        }
    }

    function render() {
        const W = canvas.width, H = canvas.height;
        const cam = camera();
        const t = G.frameT;
        const lc = (G.mode === 'EDITOR' ? editorLevel.color : G.L && G.L.color) || '#2563eb';
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, shade(lc, -0.35)); bg.addColorStop(1, shade(lc, -0.82));
        ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

        // параллакс квадраты
        ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 2 * SCALE;
        const px = cam.x * 0.2 * SCALE;
        for (let i = 0; i < 14; i++) {
            const s = (60 + (i * 37) % 90) * SCALE;
            const x = ((i * 211 * SCALE - px) % (W + 300 * SCALE) + W + 300 * SCALE) % (W + 300 * SCALE) - 150 * SCALE;
            const y = ((i * 97) % 300) * SCALE + 20 * SCALE;
            ctx.strokeRect(x, y, s, s);
        }

        // сетка в редакторе
        if (G.mode === 'EDITOR') {
            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
            const x0 = Math.floor(cam.x / GRID) * GRID;
            for (let x = x0; x < cam.x + VIEW_W + GRID; x += GRID) { const sx = (x - cam.x) * SCALE; ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke(); }
            const y0 = Math.floor(cam.y / GRID) * GRID;
            for (let y = y0; y < cam.y + VIEW_H + GRID; y += GRID) { const sy = H - (y - cam.y) * SCALE; ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke(); }
            // старт
            at(cam, 0, 0);
            ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, -40, 40, 40);
            ctx.setLineDash([4, 4]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(0, -40, 40, 40); ctx.setLineDash([]);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 10px JetBrains Mono'; ctx.fillText(tr('СТАРТ', 'START'), 2, -46);
        }

        // Объекты
        const objs = G.mode === 'EDITOR' ? editorLevel.objects : G.L.objs;
        const vx0 = cam.x - 80, vx1 = cam.x + VIEW_W + 80;
        for (const o of objs) if (o.x > vx0 && o.x < vx1) drawObject(o, t, cam);

        if (G.mode !== 'EDITOR' && G.S) {
            const S = G.S;
            // границы коридора
            if (S.ceil != null) {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.fillStyle = 'rgba(0,0,0,.35)';
                const cy = H - (S.ceil - cam.y) * SCALE;
                ctx.fillRect(0, 0, W, Math.max(0, cy));
                ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2 * SCALE;
                ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();
                if (S.floor > 0) {
                    const fy = H - (S.floor - cam.y) * SCALE;
                    ctx.fillRect(0, fy, W, H - fy);
                    ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(W, fy); ctx.stroke();
                }
            }
            // финиш
            at(cam, G.L.goalX, 0);
            for (let i = 0; i < 14; i++) for (let j = 0; j < 2; j++) { ctx.fillStyle = (i + j) % 2 ? '#fff' : '#000'; ctx.fillRect(j * 10, -i * 40 - 40, 10, 40); }
            ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(20, -600, 2000, 600);
            // надпись попытки
            at(cam, 160, 230);
            ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = 'italic 900 34px Outfit, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            ctx.fillText(tr('Попытка ', 'Attempt ') + G.attempts, 0, 0);
            // чекпоинты
            G.checkpoints.forEach(c => { at(cam, c.x + 17, c.y + 17); ctx.rotate(Math.PI / 4); ctx.fillStyle = '#3dff6e'; ctx.fillRect(-7, -7, 14, 14); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(-7, -7, 14, 14); });
            // след
            G.trail.forEach(tr_ => { at(cam, tr_.x, tr_.y); ctx.globalAlpha = tr_.a * 0.5; ctx.fillStyle = iconColor; ctx.fillRect(-tr_.s / 2, -tr_.s / 2, tr_.s, tr_.s); });
            ctx.globalAlpha = 1;
            if (G.waveTrail.length > 1) {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.beginPath();
                G.waveTrail.forEach(([x, y], i) => { const sx = (x - cam.x) * SCALE, sy = H - (y - cam.y) * SCALE; i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
                ctx.strokeStyle = iconColor; ctx.lineWidth = 6 * SCALE; ctx.globalAlpha = 0.5; ctx.stroke();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * SCALE; ctx.globalAlpha = 0.9; ctx.stroke(); ctx.globalAlpha = 1;
            }
            if (G.deathTimer === 0) drawPlayer(S, cam);
        }

        // частицы
        G.particles.forEach(p => {
            at(cam, p.x, p.y); ctx.globalAlpha = Math.max(0, p.a);
            if (p.ring) { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.strokeStyle = p.c; ctx.lineWidth = 3; ctx.stroke(); }
            else { ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); }
        });
        ctx.globalAlpha = 1;

        // земля
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const gy = H - (0 - cam.y) * SCALE;
        if (gy < H) {
            const gg = ctx.createLinearGradient(0, gy, 0, H);
            gg.addColorStop(0, shade(lc, -0.5)); gg.addColorStop(1, shade(lc, -0.9));
            ctx.fillStyle = gg; ctx.fillRect(0, gy, W, H - gy);
            ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2 * SCALE;
            const off = ((-cam.x * SCALE) % (80 * SCALE) + 80 * SCALE) % (80 * SCALE);
            for (let x = off - 80 * SCALE; x < W; x += 80 * SCALE) ctx.strokeRect(x, gy + 4 * SCALE, 80 * SCALE, 80 * SCALE);
            const lg = ctx.createLinearGradient(0, 0, W, 0);
            lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,1)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.strokeStyle = lg; ctx.lineWidth = 3 * SCALE;
            ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
        }

        // предпросмотр в редакторе
        if (G.mode === 'EDITOR' && hoverCell && activeTool !== 'ERASER') {
            ctx.globalAlpha = 0.45;
            drawObject({ type: activeTool, x: hoverCell.x, y: hoverCell.y, rotation: currentRotation }, t, cam);
            ctx.globalAlpha = 1;
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // ---------- Редактор ----------
    const TABS = {
        MODES: { icon: '🌀', ru: 'Режимы', en: 'Modes', tools: [
            ['CUBE_PORTAL', '■', 'Куб', 'Cube'], ['SHIP_PORTAL', '➤', 'Корабль', 'Ship'], ['BALL_PORTAL', '●', 'Шар', 'Ball'],
            ['UFO_PORTAL', '🛸', 'НЛО', 'UFO'], ['WAVE_PORTAL', '◢', 'Волна', 'Wave'], ['ROBOT_PORTAL', '🤖', 'Робот', 'Robot'],
            ['SPIDER_PORTAL', '🕷', 'Паук', 'Spider'], ['SWING_PORTAL', '⇅', 'Качели', 'Swing'], ['AIRPLANE_PORTAL', '✈️', 'Самолётик (v1.2)', 'Plane (v1.2)']] },
        PORTALS: { icon: '🔀', ru: 'Гравитация / Размер / Скорость', en: 'Gravity / Size / Speed', tools: [
            ['GRAV_DOWN_PORTAL', '⬇️', 'Гравитация вниз', 'Gravity down'], ['GRAV_UP_PORTAL', '⬆️', 'Гравитация вверх', 'Gravity up'],
            ['MINI_PORTAL', '🔹', 'Мини', 'Mini'], ['BIG_PORTAL', '🔷', 'Обычный размер', 'Normal size'],
            ['SPEED_05', '🐢', 'Скорость 0.5x', 'Speed 0.5x'], ['SPEED_1', '▶', 'Скорость 1x', 'Speed 1x'], ['SPEED_2', '⏩', 'Скорость 2x', 'Speed 2x'],
            ['SPEED_3', '🚀', 'Скорость 3x', 'Speed 3x'], ['SPEED_4', '⚡', 'Скорость 4x', 'Speed 4x']] },
        ORBS: { icon: '⚪', ru: 'Орбы', en: 'Orbs', tools: [
            ['ORB', '🟡', 'Жёлтый орб', 'Yellow orb'], ['PINK_ORB', '🩷', 'Розовый орб', 'Pink orb'], ['RED_ORB', '🔴', 'Красный орб', 'Red orb'],
            ['GRAVITY_ORB', '🔵', 'Синий (гравитация)', 'Blue (gravity)'], ['GREEN_ORB', '🟢', 'Зелёный (грав.+прыжок)', 'Green (grav+jump)'], ['BLACK_ORB', '⚫', 'Чёрный (вниз)', 'Black (down)']] },
        PADS: { icon: '🟨', ru: 'Батуты', en: 'Pads', tools: [
            ['PAD', '🟨', 'Жёлтый батут', 'Yellow pad'], ['PINK_PAD', '🟪', 'Розовый батут', 'Pink pad'], ['RED_PAD', '🟥', 'Красный батут', 'Red pad'], ['BLUE_PAD', '🟦', 'Синий (гравитация)', 'Blue (gravity)']] },
        SPIKES: { icon: '🔺', ru: 'Шипы и пилы', en: 'Hazards', tools: [
            ['SPIKE', '🔺', 'Шип', 'Spike'], ['SMALL_SPIKE', '▴', 'Маленький шип', 'Small spike'], ['GROUND_SPIKES', '〰️', 'Колючки', 'Ground spikes'], ['SAW', '⚙️', 'Пила', 'Saw']] },
        BLOCKS: { icon: '⬛', ru: 'Блоки', en: 'Blocks', tools: [['BLOCK', '⬛', 'Блок', 'Block'], ['SLAB', '▬', 'Полублок', 'Slab']] },
        OTHER: { icon: '🏁', ru: 'Монеты и финиш', en: 'Coins & Goal', tools: [['COIN', '🪙', 'Монета', 'Coin'], ['GOAL', '🏁', 'Финиш', 'Goal']] },
        DELETE: { icon: '❌', ru: 'Удалитель', en: 'Eraser', tools: [['ERASER', '❌', 'Удалитель', 'Eraser']] }
    };
    let activeTab = 'MODES', activeTool = 'CUBE_PORTAL', currentRotation = 0, hoverCell = null;

    function renderTabs() {
        const row = $('tabsRow'); row.innerHTML = '';
        Object.entries(TABS).forEach(([k, tab]) => {
            const b = document.createElement('button');
            b.className = 'tab-btn px-3 py-1.5 rounded-xl bg-zinc-800 text-xs font-bold text-zinc-300 hover:text-white transition shrink-0' + (k === activeTab ? ' tab-active' : '');
            b.innerText = `${tab.icon} ${tr(tab.ru, tab.en)}`;
            b.addEventListener('click', () => { activeTab = k; activeTool = tab.tools[0][0]; renderTabs(); renderToolBar(); });
            row.appendChild(b);
        });
    }
    function renderToolBar() {
        const c = $('tabContentContainer'); c.innerHTML = '';
        TABS[activeTab].tools.forEach(([id, icon, ru, en]) => {
            const b = document.createElement('button');
            b.className = `tool-btn px-3 py-2 rounded-xl border border-zinc-700 bg-zinc-800 text-xs font-bold flex items-center gap-2 transition shrink-0 ${activeTool === id ? 'tool-active' : 'text-zinc-300 hover:bg-zinc-700'}`;
            b.innerHTML = `<span class="text-base">${icon}</span><span>${tr(ru, en)}</span>`;
            b.addEventListener('click', () => { activeTool = id; renderToolBar(); });
            c.appendChild(b);
        });
    }
    SONGS.forEach((s, i) => { const o = document.createElement('option'); o.value = i; o.textContent = s.name; $('edLevelSong').appendChild(o); });

    function openEditor() {
        G.mode = 'EDITOR'; G.source = { kind: 'editor' }; G.running = false; G.attempts = 1;
        G.L = prepareLevel(editorLevel); G.S = null; G.particles = [];
        showScreen('GAME');
        $('bottomEditorBar').classList.remove('hidden');
        $('editorScrollControls').classList.remove('hidden');
        $('playControlsOverlay').classList.add('hidden');
        $('aiLogContainer').classList.add('hidden');
        $('pauseModal').classList.add('hidden'); $('winModal').classList.add('hidden');
        $('edLevelName').value = editorLevel.name;
        $('edLevelColor').value = editorLevel.color;
        $('edLevelSong').value = editorLevel.song;
        music.restart(editorLevel.song);
        updateHud(true);
    }
    $('edLevelName').addEventListener('input', e => { editorLevel.name = e.target.value; saveEditor(); updateHud(true); });
    $('edLevelColor').addEventListener('input', e => { editorLevel.color = e.target.value; saveEditor(); });
    $('edLevelSong').addEventListener('change', e => { editorLevel.song = +e.target.value; saveEditor(); music.restart(editorLevel.song); });
    $('btnEdTest').addEventListener('click', () => startLevel({ kind: 'editor' }, 'PLAY'));
    $('btnEdTestAI').addEventListener('click', () => startLevel({ kind: 'editor' }, 'AI'));

    function screenToWorld(e) {
        const rect = canvas.getBoundingClientRect();
        const sx = (e.clientX - rect.left) / rect.width * canvas.width;
        const sy = (e.clientY - rect.top) / rect.height * canvas.height;
        return { x: sx / SCALE + G.edCamX, y: (canvas.height - sy) / SCALE + G.edCamY };
    }
    function objAtPoint(w) {
        for (let i = editorLevel.objects.length - 1; i >= 0; i--) {
            const o = editorLevel.objects[i];
            if (w.x >= o.x && w.x < o.x + 40 && w.y >= o.y && w.y < o.y + 40) return i;
        }
        return -1;
    }
    function editorPlace(e) {
        const w = screenToWorld(e);
        const cx = Math.floor(w.x / GRID) * GRID, cy = Math.floor(w.y / GRID) * GRID;
        if (activeTool === 'ERASER') { const i = objAtPoint(w); if (i >= 0) editorLevel.objects.splice(i, 1); }
        else if (cx >= 0 && cy >= 0) {
            editorLevel.objects = editorLevel.objects.filter(o => !(o.x === cx && o.y === cy));
            if (activeTool === 'GOAL') editorLevel.objects = editorLevel.objects.filter(o => o.type !== 'GOAL');
            editorLevel.objects.push({ type: activeTool, x: cx, y: cy, rotation: currentRotation });
        }
        saveEditor();
    }
    let painting = false;
    canvas.addEventListener('pointerdown', e => {
        music.ensure();
        if (G.mode === 'EDITOR') {
            if (e.button === 2) { const i = objAtPoint(screenToWorld(e)); if (i >= 0) { editorLevel.objects.splice(i, 1); saveEditor(); } return; }
            if (e.button === 0) { painting = true; editorPlace(e); }
        } else { e.preventDefault(); pressDown(); }
    });
    canvas.addEventListener('pointermove', e => {
        if (G.mode !== 'EDITOR') return;
        const w = screenToWorld(e);
        const nc = { x: Math.floor(w.x / GRID) * GRID, y: Math.floor(w.y / GRID) * GRID };
        const changed = !hoverCell || nc.x !== hoverCell.x || nc.y !== hoverCell.y;
        hoverCell = nc.x >= 0 && nc.y >= 0 ? nc : null;
        if (painting && changed && ['BLOCK', 'SLAB', 'SPIKE', 'SMALL_SPIKE', 'GROUND_SPIKES', 'ERASER'].includes(activeTool)) editorPlace(e);
    });
    canvas.addEventListener('pointerleave', () => { hoverCell = null; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => {
        if (G.mode !== 'EDITOR') return;
        e.preventDefault();
        if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) moveEditorCam((e.deltaX || e.deltaY) * 0.8, 0);
        else moveEditorCam(e.deltaY * 0.8, 0);
    }, { passive: false });
    function moveEditorCam(dx, dy) {
        G.edCamX = Math.max(-200, G.edCamX + dx);
        G.edCamY = Math.max(-80, G.edCamY + dy);
        $('scrollPosText').innerText = 'x:' + Math.max(0, Math.round(G.edCamX / GRID));
    }
    $('btnScrollLeft').addEventListener('click', () => moveEditorCam(-400, 0));
    $('btnScrollRight').addEventListener('click', () => moveEditorCam(400, 0));
    $('btnScrollUp').addEventListener('click', () => moveEditorCam(0, 120));
    $('btnScrollDown').addEventListener('click', () => moveEditorCam(0, -120));
    $('btnRotateObject').addEventListener('click', () => { currentRotation = (currentRotation + 90) % 360; $('rotValText').innerText = currentRotation + '°'; });
    $('btnClearAll').addEventListener('click', () => {
        const b = $('btnClearAll');
        if (!b.dataset.armed) {
            b.dataset.armed = '1'; toast(tr('Нажми ещё раз, чтобы удалить всё', 'Click again to delete everything'));
            setTimeout(() => { delete b.dataset.armed; }, 3000); return;
        }
        delete b.dataset.armed; editorLevel.objects = []; saveEditor(); toast(tr('Карта очищена', 'Map cleared'));
    });
    $('btnExportLevel').addEventListener('click', () => {
        const data = { format: 'geometry-ai', version: '1.3', name: editorLevel.name || 'Мой уровень', color: editorLevel.color, song: editorLevel.song, objects: editorLevel.objects };
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (editorLevel.name || 'my_level').replace(/[^\wа-яё -]/gi, '_') + '.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    $('btnImportLevel').addEventListener('change', e => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                editorLevel = normalizeLevel(JSON.parse(ev.target.result));
                saveEditor(); openEditor();
                toast(tr('Уровень загружен!', 'Level loaded!'));
            } catch (err) { toast(tr('Ошибка: это не файл уровня JSON', 'Error: not a level JSON file')); }
            e.target.value = '';
        };
        reader.readAsText(file);
    });

    function toast(msg) {
        let t = $('toastBox');
        if (!t) { t = document.createElement('div'); t.id = 'toastBox'; t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-white text-black font-bold text-sm shadow-2xl'; document.body.appendChild(t); }
        t.textContent = msg; t.hidden = false;
        clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 2200);
    }

    // ---------- Управление ----------
    function pressDown() {
        if (G.screen !== 'GAME' || G.mode !== 'PLAY' || G.paused) return;
        G.held = true;
    }
    window.addEventListener('pointerup', () => { G.held = false; painting = false; });
    window.addEventListener('pointercancel', () => { G.held = false; painting = false; });
    window.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
            if (G.screen === 'GAME' && G.mode !== 'EDITOR') e.preventDefault();
            music.ensure(); pressDown();
        }
        if (e.code === 'Escape' && G.screen === 'GAME' && G.mode !== 'EDITOR') {
            if (!$('winModal').classList.contains('hidden')) exitLevel(); else setPaused(!G.paused);
        }
        if (e.code === 'KeyR' && G.screen === 'GAME' && G.mode !== 'EDITOR') { G.attempts++; resetRun(true); }
        if (G.mode === 'EDITOR' && G.screen === 'GAME') {
            if (e.code === 'ArrowRight') moveEditorCam(120, 0);
            if (e.code === 'ArrowLeft') moveEditorCam(-120, 0);
            if (e.code === 'ArrowUp') moveEditorCam(0, 80);
            if (e.code === 'ArrowDown') moveEditorCam(0, -80);
            if (e.code === 'KeyR') $('btnRotateObject').click();
        }
    });
    window.addEventListener('keyup', e => { if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) G.held = false; });
    window.addEventListener('blur', () => { G.held = false; if (G.screen === 'GAME' && G.mode !== 'EDITOR' && G.running) setPaused(true); });

    // ---------- Старт ----------
    applyLang();
    showScreen('MENU');
    requestAnimationFrame(loop);
</script>
</body>
</html>
